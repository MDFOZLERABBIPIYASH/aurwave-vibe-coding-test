name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-flight run for the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  validate:
    name: Lint, type-check, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: |
          set -e
          echo "Node: $(node -v)"
          echo "npm:  $(npm -v)"
          echo "LockfileVersion: $(node -p "require('./package-lock.json').lockfileVersion")"
          echo "Lockfile size:   $(wc -l < package-lock.json) lines"
          # `npm ci` is strict. The Sentry / Vercel Analytics / Speed
          # Insights install requires --legacy-peer-deps because of
          # a transitive Vite 8 / SvelteKit peer dep from
          # @vercel/analytics. See the lockfile-sync guard test in
          # tests/unit/lockfile.test.ts.
          npm ci --legacy-peer-deps

      - name: Validate (lint + type-check + unit)
        run: npm run validate

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

  e2e:
    name: Playwright E2E (chromium, webkit, firefox, mobile-chrome)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Run E2E tests
        # E2E takes ~3-4 min locally with the full 4-project matrix.
        # Bump the job timeout to give it room on slow runners.
        run: npm run test:e2e
        timeout-minutes: 15

      - name: Print failed test summary
        if: failure()
        # Dump the first 30 failing tests as JSON Lines so they show
        # up in the GitHub UI log without needing to download the
        # full Playwright report. Playwright writes a per-test
        # results file to test-results/ on failure.
        run: |
          if [ -d test-results ]; then
            echo "Failing tests:"
            find test-results -name "*.json" 2>/dev/null | head -30 | while read f; do
              echo "--- $f ---"
              cat "$f" | head -c 2000
              echo
            done
          fi

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
